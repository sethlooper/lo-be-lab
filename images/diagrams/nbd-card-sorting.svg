<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="800" height="400" fill="#f8f8f8"/>
  <text x="400" y="36" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="1.6" fill="#999">CARD SORTING : THREE DIMENSIONS</text>

  <!-- Three card stacks -->
  <!-- Values -->
  <rect x="80" y="80" width="180" height="220" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="170" y="110" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#1a1a1a">VALUES</text>
  <text x="170" y="128" text-anchor="middle" font-size="8" fill="#999">Knowdell Career Values</text>
  <text x="170" y="145" text-anchor="middle" font-size="8" fill="#999">what matters to you?</text>
  <!-- Sample cards -->
  <rect x="105" y="165" width="130" height="28" rx="2" fill="#1a1a1a"/>
  <text x="170" y="183" text-anchor="middle" font-size="8" fill="#ffffff">Independence</text>
  <rect x="105" y="200" width="130" height="28" rx="2" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="170" y="218" text-anchor="middle" font-size="8" fill="#1a1a1a">Creativity</text>
  <rect x="105" y="235" width="130" height="28" rx="2" fill="none" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="170" y="253" text-anchor="middle" font-size="8" fill="#999">Security</text>
  <text x="170" y="285" text-anchor="middle" font-size="8" fill="#999">pick top 2</text>

  <!-- Skills -->
  <rect x="310" y="80" width="180" height="220" rx="2" fill="#1a1a1a"/>
  <text x="400" y="110" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#ffffff">SKILLS</text>
  <text x="400" y="128" text-anchor="middle" font-size="8" fill="#aaa">Motivated Skills</text>
  <text x="400" y="145" text-anchor="middle" font-size="8" fill="#aaa">what energizes you?</text>
  <rect x="335" y="165" width="130" height="28" rx="2" fill="#E85D3A"/>
  <text x="400" y="183" text-anchor="middle" font-size="8" fill="#ffffff">Problem Solving</text>
  <rect x="335" y="200" width="130" height="28" rx="2" fill="none" stroke="#ffffff" stroke-width="0.8"/>
  <text x="400" y="218" text-anchor="middle" font-size="8" fill="#ffffff">Teaching</text>
  <rect x="335" y="235" width="130" height="28" rx="2" fill="none" stroke="#666" stroke-width="0.8"/>
  <text x="400" y="253" text-anchor="middle" font-size="8" fill="#888">Organizing</text>
  <text x="400" y="285" text-anchor="middle" font-size="8" fill="#aaa">pick top 2</text>

  <!-- Strengths -->
  <rect x="540" y="80" width="180" height="220" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="630" y="110" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#1a1a1a">STRENGTHS</text>
  <text x="630" y="128" text-anchor="middle" font-size="8" fill="#999">CliftonStrengths</text>
  <text x="630" y="145" text-anchor="middle" font-size="8" fill="#999">how do you operate?</text>
  <rect x="565" y="165" width="130" height="28" rx="2" fill="#E85D3A"/>
  <text x="630" y="183" text-anchor="middle" font-size="8" fill="#ffffff">Strategic</text>
  <rect x="565" y="200" width="130" height="28" rx="2" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="630" y="218" text-anchor="middle" font-size="8" fill="#1a1a1a">Ideation</text>
  <rect x="565" y="235" width="130" height="28" rx="2" fill="none" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="630" y="253" text-anchor="middle" font-size="8" fill="#999">Achiever</text>
  <text x="630" y="285" text-anchor="middle" font-size="8" fill="#999">pick top 2</text>

  <!-- Convergence arrows -->
  <polyline points="170,300 170,340 400,340" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <polyline points="400,300 400,340" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <polyline points="630,300 630,340 400,340" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <polygon points="396,338 400,344 404,338" fill="#1a1a1a"/>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#E85D3A" font-style="italic">do these match your word?</text>

  <line x1="32" y1="376" x2="72" y2="376" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="32" y="390" font-size="8" fill="#ccc" letter-spacing="0.5">FIG. 4</text>
</svg>