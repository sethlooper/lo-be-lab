<text x="440" y="202" text-anchor="middle" font-size="10.5" fill="#7d7d7d">The value is in the handoffs: each tool takes the previous tool&#8217;s output as its input.</text><text x="440" y="224" text-anchor="middle" font-size="10.5" fill="#7d7d7d">Compression steps (Pattern Distillation, OneWord) moved from solo work to peer dyads: compression needs a witness.</text></svg>