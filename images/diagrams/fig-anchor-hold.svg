<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" preserveAspectRatio="xMidYMid meet" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="880" height="230" fill="#ffffff"/><text x="440" y="34" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="0.3" fill="#111111">Anchor, then hold space: a two-move relational stance</text>
<circle cx="285" cy="124" r="66" fill="#000000"/>
<text x="285" y="118" text-anchor="middle" font-size="13.5" font-weight="600" fill="#fff">1. Anchor</text>
<text x="285" y="140" text-anchor="middle" font-size="10.5" fill="#cfcfcf">a steady reference</text>
<text x="285" y="155" text-anchor="middle" font-size="10.5" fill="#cfcfcf">point (directive)</text>
<text x="440" y="130" text-anchor="middle" font-size="18" fill="#7d7d7d">&#8594;</text>
<circle cx="595" cy="124" r="66" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 5"/>
<text x="595" y="118" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111111">2. Hold space</text>
<text x="595" y="140" text-anchor="middle" font-size="10.5" fill="#7d7d7d">withhold direction so they</text>
<text x="595" y="155" text-anchor="middle" font-size="10.5" fill="#7d7d7d">make sense for themselves</text>
<text x="440" y="212" text-anchor="middle" font-size="10.5" fill="#7d7d7d">Inclusive leadership as a stance, not a competency cluster; the skill is knowing when to switch.</text></svg>