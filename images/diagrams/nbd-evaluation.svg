<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="700" height="340" fill="#f8f8f8" rx="4"/>
  <text x="350" y="30" text-anchor="middle" font-size="9" fill="#999" letter-spacing="2" font-weight="500">FIG. 8</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">EVALUATION FRAMEWORK</text>
<rect x="40" y="75" width="290" height="240" rx="6" fill="white" stroke="#e0e0e0"/><circle cx="70" cy="100" r="10" fill="#1a1a1a"/><text x="88" y="104" font-size="11" fill="#1a1a1a" font-weight="600">Upperclassmen</text><circle cx="65" cy="135" r="3" fill="#E85D3A"/><text x="78" y="139" font-size="10" fill="#1a1a1a">Confidence in what to emphasize</text><circle cx="65" cy="163" r="3" fill="#E85D3A"/><text x="78" y="167" font-size="10" fill="#1a1a1a">Less need to over-explain</text><circle cx="65" cy="191" r="3" fill="#E85D3A"/><text x="78" y="195" font-size="10" fill="#1a1a1a">Clarity in professional conversations</text><rect x="55" y="225" width="260" height="40" rx="4" fill="#f8f8f8" stroke="#e0e0e0"/><text x="65" y="241" font-size="8" fill="#999" font-style="italic">"I feel more confident deciding what to</text><text x="65" y="254" font-size="8" fill="#999" font-style="italic">emphasize when talking about my experiences."</text><rect x="370" y="75" width="290" height="240" rx="6" fill="white" stroke="#e0e0e0"/><circle cx="400" cy="100" r="10" fill="#E85D3A"/><text x="418" y="104" font-size="11" fill="#1a1a1a" font-weight="600">First-Years</text><circle cx="395" cy="135" r="3" fill="#1a1a1a"/><text x="408" y="139" font-size="10" fill="#1a1a1a">Reduced anxiety about direction</text><circle cx="395" cy="163" r="3" fill="#1a1a1a"/><text x="408" y="167" font-size="10" fill="#1a1a1a">Comfort describing self honestly</text><circle cx="395" cy="191" r="3" fill="#1a1a1a"/><text x="408" y="195" font-size="10" fill="#1a1a1a">Clearer sense of what to explore</text><rect x="385" y="225" width="260" height="40" rx="4" fill="#f8f8f8" stroke="#e0e0e0"/><text x="395" y="241" font-size="8" fill="#999" font-style="italic">"I feel less pressure to have my future</text><text x="395" y="254" font-size="8" fill="#999" font-style="italic">fully figured out right now."</text></svg>