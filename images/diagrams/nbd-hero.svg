<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif">
  <rect width="800" height="320" fill="#f8f8f8"/>
  <text x="400" y="36" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="1.6" fill="#999">NARRATIVE BY DESIGN : FROM COMPLEXITY TO CLARITY</text>

  <!-- Three compression stages, decreasing in size -->
  <!-- Stage 1: Paragraph (large rect) -->
  <rect x="60" y="70" width="200" height="160" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="160" y="95" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#1a1a1a">PARAGRAPH</text>
  <!-- Content lines -->
  <line x1="80" y1="115" x2="240" y2="115" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="130" x2="230" y2="130" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="145" x2="240" y2="145" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="160" x2="220" y2="160" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="175" x2="235" y2="175" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="190" x2="200" y2="190" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="80" y1="205" x2="180" y2="205" stroke="#e0e0e0" stroke-width="2"/>
  <text x="160" y="245" text-anchor="middle" font-size="8" fill="#999">90 seconds, unfiltered</text>

  <!-- Arrow 1: right then down -->
  <polyline points="262,150 310,150 310,150 340,150" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="338,146 344,150 338,154" fill="#1a1a1a"/>

  <!-- Stage 2: Sentence (medium rect) -->
  <rect x="350" y="110" width="140" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="420" y="138" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#1a1a1a">SENTENCE</text>
  <line x1="370" y1="155" x2="470" y2="155" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="370" y1="170" x2="440" y2="170" stroke="#e0e0e0" stroke-width="2"/>
  <text x="420" y="215" text-anchor="middle" font-size="8" fill="#999">one clear idea</text>

  <!-- Arrow 2 -->
  <polyline points="492,150 530,150 530,150 558,150" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polygon points="556,146 562,150 556,154" fill="#1a1a1a"/>

  <!-- Stage 3: One Word (circle, filled orange) -->
  <circle cx="640" cy="150" r="55" fill="#E85D3A"/>
  <text x="640" y="143" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#ffffff">ONE</text>
  <text x="640" y="160" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#ffffff">WORD</text>
  <text x="640" y="225" text-anchor="middle" font-size="8" fill="#E85D3A">your narrative center</text>

  <!-- Figure label -->
  <line x1="32" y1="296" x2="72" y2="296" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="32" y="310" font-size="8" fill="#ccc" letter-spacing="0.5">FIG. 1</text>
</svg>