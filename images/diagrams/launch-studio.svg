<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif">
  <rect width="800" height="400" fill="#f8f8f8"/>
  <text x="400" y="36" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="1.6" fill="#999">LAUNCH STUDIO : 120-MINUTE SESSION</text>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="80" y="160" width="100" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="130" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">IDENTITY</text>
  <text x="130" y="209" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">MAPPING</text>
  <text x="130" y="230" text-anchor="middle" font-size="8" fill="#999">20 min</text>
  <rect x="220" y="160" width="100" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="270" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">TILE</text>
  <text x="270" y="209" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">SORTING</text>
  <text x="270" y="230" text-anchor="middle" font-size="8" fill="#999">20 min</text>
  <rect x="360" y="160" width="100" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="410" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">PATTERN</text>
  <text x="410" y="209" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">DISTILL</text>
  <text x="410" y="230" text-anchor="middle" font-size="8" fill="#999">20 min</text>
  <rect x="500" y="160" width="100" height="80" rx="2" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2"/>
  <text x="550" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#ffffff">ONEWORD</text>
  <text x="550" y="230" text-anchor="middle" font-size="8" fill="#ffffff">15 min</text>
  <rect x="620" y="160" width="100" height="80" rx="2" fill="#E85D3A" stroke="#E85D3A" stroke-width="1.2"/>
  <text x="670" y="195" text-anchor="middle" font-size="8" font-weight="600" fill="#ffffff">SYNTHESIS</text>
  <text x="670" y="230" text-anchor="middle" font-size="8" fill="#ffffff">25 min</text>
  <polygon points="170,190 180,200 170,210" fill="#E85D3A"/>
  <text x="175" y="180" text-anchor="middle" font-size="7" fill="#E85D3A">PAUSE</text>
  <polygon points="310,190 320,200 310,210" fill="#E85D3A"/>
  <text x="315" y="180" text-anchor="middle" font-size="7" fill="#E85D3A">PAUSE</text>
  <polygon points="450,190 460,200 450,210" fill="#E85D3A"/>
  <text x="455" y="180" text-anchor="middle" font-size="7" fill="#E85D3A">PAUSE</text>
  <polygon points="590,190 600,200 590,210" fill="#E85D3A"/>
  <text x="595" y="180" text-anchor="middle" font-size="7" fill="#E85D3A">PAUSE</text>
  <text x="400" y="300" text-anchor="middle" font-size="8.5" fill="#999" letter-spacing="0.5">pauses between activities are what make it work</text>
  <text x="60" y="330" font-size="8" fill="#999">0 min</text>
  <text x="710" y="330" font-size="8" fill="#999" text-anchor="end">120 min</text>
  <line x1="32" y1="376" x2="72" y2="376" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="32" y="390" font-size="8" fill="#ccc" letter-spacing="0.5">FIG. 10</text>
