<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif">
  <rect width="700" height="480" fill="#f8f8f8" rx="4"/>
  <text x="350" y="30" text-anchor="middle" font-size="9" fill="#999" letter-spacing="2" font-weight="500">FIG. 4</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">TWO AUDIENCES, TWO OUTCOMES</text>
<rect x="40" y="75" width="300" height="380" rx="6" fill="white" stroke="#e0e0e0"/><text x="180" y="100" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600" letter-spacing="1">UPPERCLASSMEN</text><text x="180" y="116" text-anchor="middle" font-size="9" fill="#999">2nd-4th Year</text><text x="180" y="145" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">CORE PROBLEM</text><text x="180" y="161" text-anchor="middle" font-size="11" fill="#1a1a1a">Too many experiences,</text><text x="180" y="175" text-anchor="middle" font-size="11" fill="#1a1a1a">unclear emphasis</text><text x="180" y="210" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">ROLE OF NARRATIVE</text><text x="180" y="226" text-anchor="middle" font-size="11" fill="#1a1a1a">Communication tool</text><text x="180" y="275" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">THE WORD IS</text><text x="180" y="291" text-anchor="middle" font-size="11" fill="#1a1a1a">Brand anchor that</text><text x="180" y="305" text-anchor="middle" font-size="11" fill="#1a1a1a">organizes experience</text><text x="180" y="340" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">EMOTIONAL</text><text x="180" y="356" text-anchor="middle" font-size="11" fill="#1a1a1a">Confidence and control</text><text x="180" y="405" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">KEY SHIFT</text><text x="180" y="421" text-anchor="middle" font-size="11" fill="#1a1a1a">"I know what</text><text x="180" y="435" text-anchor="middle" font-size="11" fill="#1a1a1a">to emphasize."</text><rect x="360" y="75" width="300" height="380" rx="6" fill="white" stroke="#e0e0e0"/><text x="520" y="100" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600" letter-spacing="1">FIRST-YEARS</text><text x="520" y="116" text-anchor="middle" font-size="9" fill="#999">Direction-Uncertain</text><text x="520" y="145" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">CORE PROBLEM</text><text x="520" y="161" text-anchor="middle" font-size="11" fill="#1a1a1a">Too much uncertainty,</text><text x="520" y="175" text-anchor="middle" font-size="11" fill="#1a1a1a">unclear signals</text><text x="520" y="210" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">ROLE OF NARRATIVE</text><text x="520" y="226" text-anchor="middle" font-size="11" fill="#1a1a1a">Sense-making tool</text><text x="520" y="275" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">THE WORD IS</text><text x="520" y="291" text-anchor="middle" font-size="11" fill="#1a1a1a">Working hypothesis that</text><text x="520" y="305" text-anchor="middle" font-size="11" fill="#1a1a1a">guides reflection</text><text x="520" y="340" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">EMOTIONAL</text><text x="520" y="356" text-anchor="middle" font-size="11" fill="#1a1a1a">Relief and reassurance</text><text x="520" y="405" text-anchor="middle" font-size="8" fill="#E85D3A" letter-spacing="1.5" font-weight="500">KEY SHIFT</text><text x="520" y="421" text-anchor="middle" font-size="11" fill="#1a1a1a">"I don't need to have it</text><text x="520" y="435" text-anchor="middle" font-size="11" fill="#1a1a1a">all figured out yet."</text><line x1="350" y1="90" x2="350" y2="440" stroke="#e0e0e0" stroke-dasharray="4,4"/></svg>