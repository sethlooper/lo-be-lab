<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="800" height="400" fill="#f8f8f8"/>
  <text x="400" y="36" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="1.6" fill="#999">DIGITAL WORKSHOP : 5 PHASES</text>

  <!-- App tabs across top -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Tab nodes -->
  <rect x="85" y="60" width="90" height="32" rx="16" fill="#1a1a1a"/>
  <text x="130" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">INTAKE</text>

  <rect x="210" y="60" width="90" height="32" rx="16" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="255" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1a1a">RESUME</text>

  <rect x="340" y="60" width="110" height="32" rx="16" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="395" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1a1a">CATEGORIZE</text>

  <rect x="490" y="60" width="90" height="32" rx="16" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="535" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1a1a">REWRITE</text>

  <rect x="620" y="60" width="90" height="32" rx="16" fill="#E85D3A"/>
  <text x="665" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">REFLECT</text>

  <!-- Below: what happens in each phase -->
  <!-- Intake details -->
  <polyline points="130,92 130,130" fill="none" stroke="#1a1a1a" stroke-width="0.75"/>
  <rect x="60" y="130" width="140" height="160" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="130" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">7 STEPS</text>
  <text x="130" y="175" text-anchor="middle" font-size="8" fill="#999">Write paragraph</text>
  <text x="130" y="192" text-anchor="middle" font-size="8" fill="#999">Review draft</text>
  <text x="130" y="209" text-anchor="middle" font-size="8" fill="#999">Compress to sentence</text>
  <text x="130" y="226" text-anchor="middle" font-size="8" fill="#999">Compress to word</text>
  <text x="130" y="243" text-anchor="middle" font-size="8" fill="#999">Select values</text>
  <text x="130" y="260" text-anchor="middle" font-size="8" fill="#999">Select skills</text>
  <text x="130" y="277" text-anchor="middle" font-size="8" fill="#999">Select strengths</text>

  <!-- Resume -->
  <polyline points="255,92 255,130" fill="none" stroke="#1a1a1a" stroke-width="0.75"/>
  <rect x="205" y="130" width="100" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="255" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">UPLOAD</text>
  <text x="255" y="175" text-anchor="middle" font-size="8" fill="#999">PDF or DOCX</text>
  <text x="255" y="192" text-anchor="middle" font-size="8" fill="#999">Extract experiences</text>

  <!-- Categorize -->
  <polyline points="395,92 395,130" fill="none" stroke="#1a1a1a" stroke-width="0.75"/>
  <rect x="335" y="130" width="120" height="80" rx="2" fill="#1a1a1a"/>
  <text x="395" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#ffffff">SORT</text>
  <text x="395" y="175" text-anchor="middle" font-size="8" fill="#aaa">Values vs Skills</text>
  <text x="395" y="192" text-anchor="middle" font-size="8" fill="#aaa">vs Strengths</text>

  <!-- Rewrite -->
  <polyline points="535,92 535,130" fill="none" stroke="#1a1a1a" stroke-width="0.75"/>
  <rect x="485" y="130" width="100" height="80" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="535" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">NEW DRAFT</text>
  <text x="535" y="175" text-anchor="middle" font-size="8" fill="#999">Grounded in</text>
  <text x="535" y="192" text-anchor="middle" font-size="8" fill="#999">evidence</text>

  <!-- Reflect -->
  <polyline points="665,92 665,130" fill="none" stroke="#E85D3A" stroke-width="0.75"/>
  <rect x="615" y="130" width="100" height="80" rx="2" fill="#E85D3A"/>
  <text x="665" y="155" text-anchor="middle" font-size="8" font-weight="600" fill="#ffffff">COMPARE</text>
  <text x="665" y="175" text-anchor="middle" font-size="8" fill="#ffffff" opacity="0.7">Before vs After</text>
  <text x="665" y="192" text-anchor="middle" font-size="8" fill="#ffffff" opacity="0.7">What changed?</text>

  <text x="400" y="350" text-anchor="middle" font-size="9" fill="#999">ccd-nbd.vercel.app</text>

  <line x1="32" y1="376" x2="72" y2="376" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="32" y="390" font-size="8" fill="#ccc" letter-spacing="0.5">FIG. 3</text>
</svg>